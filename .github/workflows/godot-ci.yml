name: Godot CI - Windows EXE and Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate and export game
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android export components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --list_installed

      - name: Run structural project validation
        run: python3 tests/validate_project.py

      - name: Import project and parse resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows x86_64
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/ProjectUnknown.exe

      - name: Export Android arm64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ProjectUnknown.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectUnknown-Windows-x86_64
          path: build/ProjectUnknown*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectUnknown-Android-arm64-debug
          path: build/ProjectUnknown.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
