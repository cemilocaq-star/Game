name: Godot CI - Windows EXE and Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate and export game
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android export components
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.22.1"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Configure Android preset signing
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("export_presets.cfg")
          data = path.read_text(encoding="utf-8")
          home = os.environ["HOME"]
          replacements = {
              'keystore/debug=""': f'keystore/debug="{home}/.android/debug.keystore"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in replacements.items():
              if old not in data:
                  raise SystemExit(f"Expected Android signing field not found: {old}")
              data = data.replace(old, new, 1)
          path.write_text(data, encoding="utf-8")
          print("\n".join(line for line in data.splitlines() if line.startswith("keystore/") or line.startswith("package/signed=")))
          PY

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --list_installed

      - name: Download and verify CC0 event audio
        run: python3 tools/fetch_open_audio_assets.py

      - name: Run structural project validation
        run: python3 tests/validate_project.py

      - name: Import project and parse resources
        run: godot --headless --editor --path . --quit

      - name: Start dedicated server smoke test
        shell: bash
        run: |
          output="$(godot --headless --path . -- --server --smoke-test 2>&1)"
          printf '%s\n' "$output"
          grep -q "OxenWar authoritative server listening on UDP 2456" <<< "$output"
          grep -q "OxenWar dedicated server smoke test passed" <<< "$output"
          if grep -q "SCRIPT ERROR:" <<< "$output"; then
            echo "Godot reported a script error during server startup."
            exit 1
          fi

      - name: Export Windows x86_64
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/OxenWar.exe

      - name: Export Android arm64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/OxenWar.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OxenWar-Windows-x86_64
          path: build/OxenWar.exe
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OxenWar-Android-arm64-debug
          path: build/OxenWar.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
