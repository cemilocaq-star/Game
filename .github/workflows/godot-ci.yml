name: Godot CI - Windows EXE and Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate and export game
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android export components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          sdkmanager --list_installed

      - name: Run structural project validation
        run: python3 tests/validate_project.py

      - name: Import project and parse resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows x86_64
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/OxenWar.exe

      - name: Export Android arm64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/OxenWar.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OxenWar-Windows-x86_64
          path: build/ProjectUnknown*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OxenWar-Android-arm64-debug
          path: build/OxenWar.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
