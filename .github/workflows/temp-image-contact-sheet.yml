name: Temporary repository image contact sheet

on:
  push:
    branches:
      - inspect/repo-image-contact-sheet

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image library
        run: python -m pip install --user Pillow
      - name: Build contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          files = []
          for p in sorted(Path('.').iterdir()):
              if p.is_file() and p.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp'}:
                  try:
                      im = Image.open(p).convert('RGB')
                      files.append((p.name, im.copy()))
                  except Exception:
                      pass
          if not files:
              raise SystemExit("No root-level images found")
          cell_w, image_h, label_h = 320, 220, 48
          cols = 2
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * cell_w, rows * (image_h + label_h)), '#f4f4f4')
          draw = ImageDraw.Draw(sheet)
          for i, (name, im) in enumerate(files):
              x = (i % cols) * cell_w
              y = (i // cols) * (image_h + label_h)
              thumb = ImageOps.contain(im, (cell_w - 16, image_h - 16))
              sheet.paste(thumb, (x + (cell_w - thumb.width)//2, y + (image_h - thumb.height)//2))
              draw.text((x + 8, y + image_h + 4), name[:48], fill='#111111')
          sheet.save('repo-image-contact-sheet.jpg', quality=88)
          print(f"Created contact sheet for {len(files)} root-level images")
          PY
      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: repo-image-contact-sheet
          path: repo-image-contact-sheet.jpg
          retention-days: 1
