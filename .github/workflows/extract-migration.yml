name: Extract migration project

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project files into repository root
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-migration
          unzip -q PROJECT_UNKNOWN_GODOT_MIGRATION.zip -d /tmp/godot-migration
          cp -a /tmp/godot-migration/PROJECT_UNKNOWN_GODOT_MIGRATION/. .
          rm PROJECT_UNKNOWN_GODOT_MIGRATION.zip
          rm .github/workflows/extract-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Godot migration project into repository"
          git push